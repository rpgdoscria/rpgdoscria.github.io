<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar em sala — Rpg dos Cria</title>
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="../css/style.css?v=202607271440">
  <link rel="stylesheet" href="../css/theme-custom.css?v=202607271440">
</head>
<body>
  <div id="header-mount"></div>

  <main class="login-wrap">
    <div class="login-card">
      <h1>Entrar em sala</h1>
      <p class="subtitle">Digite o código de 6 caracteres que o mestre compartilhou e escolha sua cor.</p>

      <form id="enter-form">
        <div class="field">
          <label for="code">Código da sala</label>
          <input type="text" id="code" maxlength="6" autocomplete="off" required
                 style="text-transform:uppercase;letter-spacing:0.2em;font-family:var(--font-mono);font-size:24px;text-align:center"
                 placeholder="XXXXXX">
        </div>

        <div class="field">
          <label>Sua cor (visível no chat, ficha e dados)</label>
          <div class="color-picker-row" id="color-picker">
            <!-- Paleta de 8 cores predefinidas -->
            <button type="button" class="color-swatch" data-color="#ef4444" style="background:#ef4444" title="Vermelho"></button>
            <button type="button" class="color-swatch" data-color="#f97316" style="background:#f97316" title="Laranja"></button>
            <button type="button" class="color-swatch" data-color="#eab308" style="background:#eab308" title="Amarelo"></button>
            <button type="button" class="color-swatch" data-color="#22c55e" style="background:#22c55e" title="Verde"></button>
            <button type="button" class="color-swatch" data-color="#06b6d4" style="background:#06b6d4" title="Ciano"></button>
            <button type="button" class="color-swatch" data-color="#3b82f6" style="background:#3b82f6" title="Azul"></button>
            <button type="button" class="color-swatch" data-color="#a855f7" style="background:#a855f7" title="Roxo"></button>
            <button type="button" class="color-swatch" data-color="#ec4899" style="background:#ec4899" title="Rosa"></button>
            <!-- Quadrado de cor customizada — abre o seletor nativo -->
            <button type="button" class="color-custom-square" id="color-custom-btn" title="Cor personalizada" style="background:#a855f7">
              <span class="color-custom-icon">🎨</span>
            </button>
            <input type="color" id="color-custom" value="#a855f7" style="position:absolute;width:0;height:0;opacity:0;pointer-events:none">
          </div>
          <p class="text-xs muted mt-2">Cor atual: <code id="color-current">#a855f7</code> — clique no quadrado 🎨 para escolher qualquer cor</p>
        </div>

        <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center" id="btn-enter">
          Entrar na sala →
        </button>
      </form>

      <p class="muted text-xs mt-6" style="text-align:center">
        Não tem o código? Peça ao mestre.<br>
        É mestre? <a href="/criar-sala">Criar nova sala</a>
      </p>
    </div>
  </main>

  <script src="../js/config.js?v=202607271440"></script>
  <script src="../js/api.js?v=202607271440"></script>
  <script src="../js/auth.js?v=202607271440"></script>
  <script>
    (function () {
      window.auth.mountHeader("#header-mount", "rooms");
      const sess = window.auth.requireAuth("viewer");
      if (!sess) return;

      const input = document.getElementById("code");
      const btn = document.getElementById("btn-enter");
      const form = document.getElementById("enter-form");
      const colorCustom = document.getElementById("color-custom");
      const colorCustomBtn = document.getElementById("color-custom-btn");
      const colorCurrent = document.getElementById("color-current");
      let selectedColor = "#a855f7";

      // Auto-uppercase e remove não-alfanumérico
      input.addEventListener("input", () => {
        input.value = input.value.toUpperCase().replace(/[^A-Z0-9]/g, "");
      });

      // Paleta de cores — clique seleciona
      document.querySelectorAll(".color-swatch").forEach(sw => {
        sw.addEventListener("click", () => {
          selectedColor = sw.dataset.color;
          colorCustom.value = selectedColor;
          colorCustomBtn.style.background = selectedColor;
          colorCurrent.textContent = selectedColor;
          document.querySelectorAll(".color-swatch").forEach(s => s.classList.remove("selected"));
          sw.classList.add("selected");
        });
      });
      // Quadrado de cor customizada — clique abre o seletor nativo
      colorCustomBtn.addEventListener("click", () => colorCustom.click());
      colorCustom.addEventListener("input", () => {
        selectedColor = colorCustom.value;
        colorCustomBtn.style.background = selectedColor;
        colorCurrent.textContent = selectedColor;
        document.querySelectorAll(".color-swatch").forEach(s => s.classList.remove("selected"));
      });

      // Seleciona roxo por padrão
      document.querySelector('.color-swatch[data-color="#a855f7"]')?.classList.add("selected");

      form.addEventListener("submit", (e) => {
        e.preventDefault();
        const code = input.value.trim().toUpperCase();
        if (!code || code.length !== 6) {
          alert("Digite o código completo de 6 caracteres.");
          return;
        }
        // Guarda a cor no sessionStorage — sala lê ao conectar e envia via WS
        try {
          sessionStorage.setItem("rpg_player_color", selectedColor);
        } catch {}
        // Redireciona pro endereço real da sala. sala vai fazer a
        // verificação REST primeiro — se o código não existir, mostra
        // "sala não encontrada" em vez de cair numa tela de criação.
        location.href = `/sala?code=${encodeURIComponent(code)}`;
      });

      // Se veio ?code= na URL, pré-preenche e tenta direto
      const params = new URLSearchParams(location.search);
      const preset = params.get("code");
      if (preset) {
        input.value = preset.toUpperCase();
        form.dispatchEvent(new Event("submit"));
      }
    })();
  </script>
</body>
</html>
